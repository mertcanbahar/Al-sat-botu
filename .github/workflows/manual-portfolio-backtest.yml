name: Manual portfolio backtest (strategy vs. buy-and-hold)

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of daily history to backtest"
        required: false
        default: "5"
      max_drawdown_pct:
        description: "Override MAX_DRAWDOWN_PCT risk guardrail (default 0.20). A non-default value writes to backtest/results/max-drawdown-<value>/ instead of overwriting the main results."
        required: false
        default: "0.20"

permissions:
  contents: write

jobs:
  portfolio-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVE_DATA_KEY }}
      ALSATBOTU_MAX_DRAWDOWN_PCT: ${{ inputs.max_drawdown_pct || '0.20' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 20-symbol portfolio backtest
        run: |
          OUT_DIR="backtest/results"
          if [ "${{ inputs.max_drawdown_pct || '0.20' }}" != "0.20" ]; then
            OUT_DIR="backtest/results/max-drawdown-${{ inputs.max_drawdown_pct }}"
          fi
          mkdir -p "$OUT_DIR"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          python backtest/portfolio_backtest.py --years "${{ inputs.years || '5' }}" --out-dir "$OUT_DIR"

      - name: Commit and push backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_DIR"
          if git diff --cached --quiet; then
            echo "No backtest changes to commit."
            exit 0
          fi
          git commit -m "chore: update portfolio backtest results"
          # This job runs for several minutes fetching data before it ever
          # commits, so main can easily move underneath it (another
          # workflow's push) between checkout and push. Rebase onto the
          # latest main and retry a few times rather than failing outright.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push backtest results after 5 attempts."
          exit 1
