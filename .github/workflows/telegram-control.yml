name: Telegram control panel

on:
  workflow_dispatch: {}
  schedule:
    # Every 5 minutes -- short-polls Telegram for the control-panel button
    # taps and the initial text-message trigger (see
    # scripts/process_telegram_controls.py).
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: db-write
  cancel-in-progress: false

jobs:
  process-controls:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVE_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process pending Telegram control-panel actions
        run: python scripts/process_telegram_controls.py

      - name: Commit and push portfolio/offset changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio.json data/telegram_control_offset.json
          if git diff --cached --quiet; then
            echo "No control changes to commit."
            exit 0
          fi
          git commit -m "chore: apply Telegram control-panel action"
          # Fetch + rebase + retry for the ordinary race of another run's
          # commit landing first. A real conflict aborts the rebase and
          # fails the job instead of forcing a resolution that could
          # silently overwrite data.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/3), fetching latest main and rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase conflict on portfolio state -- aborting rather than overwriting. Investigate manually."
              git rebase --abort
              exit 1
            fi
          done
          echo "::error::Failed to push portfolio state after 3 attempts."
          exit 1
