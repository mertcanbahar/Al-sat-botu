name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate docs/watchlist.json
        run: |
          python - <<'PY'
          import json
          from alsatbotu.config import WATCHLIST

          data = [{"symbol": w["symbol"], "category": w["category"]} for w in WATCHLIST]
          with open("docs/watchlist.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Sync portfolio data into docs/
        run: |
          mkdir -p docs/data
          [ -f data/portfolio.json ] && cp data/portfolio.json docs/data/portfolio.json || true
          [ -f data/signals.jsonl ] && cp data/signals.jsonl docs/data/signals.jsonl || true
          [ -f data/health.json ] && cp data/health.json docs/data/health.json || true
          [ -f data/equity.jsonl ] && cp data/equity.jsonl docs/data/equity.jsonl || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
