name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # docs/ altındaki kopya artık repoda commit'li (Pages branch'ten
      # yayımladığı için zorunlu). Burada yine de çalıştırılıyor: bir koşu
      # docs/'u güncellemeyi atlamışsa bu deployment yine de taze veriyle
      # çıkar. Tek uygulama, aynı betik.
      - name: Sync dashboard data into docs/
        run: python scripts/sync_docs_data.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
