name: Evaluation loop (weekly improvement)

on:
  workflow_dispatch: {}
  schedule:
    # Sunday 21:00 UTC (00:00 Europe/Istanbul Monday), after the day's
    # last hourly eval cycle and daily report have run.
    - cron: "0 21 * * 0"

permissions:
  contents: write

jobs:
  weekly-improvement:
    runs-on: ubuntu-latest
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVE_DATA_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly improvement loop
        run: python scripts/run_improvement_loop.py

      - name: Commit and push strategy version registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evaluation.db
          if git diff --cached --quiet; then
            echo "No strategy version changes to commit."
            exit 0
          fi
          git commit -m "chore: update strategy version registry"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push strategy version registry after 5 attempts."
          exit 1
