name: Manual portfolio run

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days of history to fetch per symbol"
        required: false
        default: "60"

permissions:
  contents: write

jobs:
  run-portfolio:
    runs-on: ubuntu-latest
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVE_DATA_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio update
        run: python scripts/run_portfolio.py "${{ inputs.days }}"

      - name: Commit and push portfolio state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio.json data/signals.jsonl
          if git diff --cached --quiet; then
            echo "No portfolio changes to commit."
          else
            git commit -m "chore: update paper portfolio state"
            git push
          fi
