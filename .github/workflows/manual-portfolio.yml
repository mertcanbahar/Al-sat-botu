name: Manual portfolio run

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days of history to fetch per symbol"
        required: false
        default: "60"
  schedule:
    # Weekdays 22:00 UTC
    - cron: "0 22 * * 1-5"

permissions:
  contents: write
  actions: write  # needed to trigger pages.yml after pushing (see below)

concurrency:
  group: db-write
  cancel-in-progress: false

jobs:
  run-portfolio:
    runs-on: ubuntu-latest
    env:
      ALSATBOTU_VADE: ${{ vars.ALSATBOTU_VADE || 'uzun' }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVE_DATA_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run portfolio update
        run: python scripts/run_portfolio.py "${{ inputs.days || '60' }}"

      # docs/data/ and docs/watchlist.json are no longer generated or
      # committed here: they are build output, generated from data/ inside
      # pages.yml at deploy time, so data/ stays the single source of
      # truth instead of a second, manually-synced copy.
      - name: Commit and push portfolio state
        id: commit_and_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/portfolio.json data/signals.jsonl data/health.json data/equity.jsonl; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No portfolio changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update paper portfolio state"
          # main can move between checkout and this push (another workflow's
          # commit landing first) -- fetch + rebase + retry a few times for
          # that ordinary race. A real conflict (two runs touching the same
          # bytes) aborts the rebase and fails the job instead of forcing a
          # resolution that could silently overwrite data.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt/3), fetching latest main and rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase conflict on portfolio data -- aborting rather than overwriting. Investigate manually."
              git rebase --abort
              exit 1
            fi
          done
          echo "::error::Failed to push portfolio state after 3 attempts."
          exit 1

      # Pushes made with the default GITHUB_TOKEN don't trigger other
      # workflows' `on: push` events, so pages.yml would not otherwise
      # re-run after this job's push -- explicitly dispatch it so the
      # dashboard picks up the new data/ without a human push.
      - name: Trigger Pages rebuild
        if: steps.commit_and_push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref ${{ github.ref_name }}
