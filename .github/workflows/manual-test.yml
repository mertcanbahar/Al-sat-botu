name: Manual test

on:
  workflow_dispatch:

jobs:
  test-single-symbol:
    runs-on: ubuntu-latest
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVE_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run single-symbol smoke test
        run: python scripts/test_single_symbol.py
